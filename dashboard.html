<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-dashboard">
    

<div class="dashboard">

 
  <div class="sidebar">
    <img src="img/EduSoft.png.png" alt="Logo EduSoft"
     class="logo-principal logo-sidebar">
    <h2>Sistema Escolar</h2>
    <ul>
      <li>Inicio</li>
      <li>Estudiantes</li>
      <li>Profesores</li>
      <li>Notas</li>
      <li>Configuración</li>
      <li><a href="#" onclick="logout()">Cerrar sesión</a></li>
    </ul>
  </div>

  
  <div class="main-content">
    <header>
      <h1 id="bienvenida"></h1>
    </header>

    <div class="cards">
      <div class="card">
       <img src="img/Estudiantes.png.jpg" alt="Estudiantes" class="card-img">
        <p>Estudiantes</p>
      </div>

      <div class="card">
         <img src="img/Maestros.png.jpg" alt="Profesores" class="card-img">
        <p>Profesores</p>
      </div>

      <div class="card">
         <img src="img/Materias.png.jpg" alt="Materias" class="card-img">
        <p>Materias</p>
      </div>

      <a href="graficos.html" class="card-link">

      <div class="card">
         <img src="img/gráficos.png.jpg" alt="Graficos" class="card-img">
        <p>Graficos</p>
      </div>
      </a>
   </div>

    <!--CRUD MEJORADO (SOLO ENVUELTO)-->
    <div class="crud-container">

      <h2>Gestión de usuarios</h2>

      <div class="crud-form">
      <input id="nombre" placeholder="Nombre">
      <input id="email" placeholder="Email">
      <input id="password" type="password" placeholder="Contraseña">
  <button id="agregar">Agregar</button>
</div>

      <div id="lista"></div>
    </div>
    

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
